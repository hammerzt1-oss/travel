<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laya skeleton smoke test</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #5fa0bd; }
    body { display: grid; place-items: center; }
    #stage { position: relative; width: 640px; height: 480px; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #status { position: fixed; top: 8px; left: 8px; color: white; font: 14px sans-serif; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="status">loading</div>
  <script src="/game/runtime/laya.vendor.js"></script>
  <script>
    (async function () {
      const status = document.getElementById('status');
      try {
        Laya.init(640, 480);
        const canvas = Laya.Render.canvas;
        canvas.style.position = 'absolute';
        canvas.style.inset = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.background = 'transparent';
        document.getElementById('stage').appendChild(canvas);
        const [skBuffer, image] = await Promise.all([
          fetch('/game/assets/pdzz/characters/skeletons/rabbit2.sk').then(response => response.arrayBuffer()),
          new Promise((resolve, reject) => {
            const value = new Image();
            value.onload = () => resolve(value);
            value.onerror = () => reject(new Error('character texture failed to load'));
            value.src = '/game/assets/pdzz/characters/rabbit2.png';
          }),
        ]);
        const templet = new Laya.Templet();
        templet.once('complete', templet, function () {
          const skeleton = templet.buildArmature(0);
          skeleton.x = 320;
          skeleton.y = 350;
          skeleton.scale(0.55, 0.55);
          skeleton.play(0, true);
          Laya.stage.addChild(skeleton);
          status.textContent = 'loaded: ' + skeleton.getAnimNum() + ' animations: ' +
            Array.from({ length: skeleton.getAnimNum() }, (_, i) => skeleton.getAniNameByIndex(i)).join(', ');
        });
        templet.once('error', templet, function (err) {
          status.textContent = 'error: ' + JSON.stringify(err, Object.getOwnPropertyNames(err));
        });
        templet.parseData(new Laya.Texture(image), skBuffer);
      } catch (error) {
        status.textContent = 'error: ' + (error && error.stack ? error.stack : JSON.stringify(error, Object.getOwnPropertyNames(error)));
      }
    }());
  </script>
</body>
</html>
