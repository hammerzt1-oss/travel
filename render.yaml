services:
  - type: web
    name: travel-backend-afnq
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # Compile once during the deploy; do not compile again during process start.
    buildCommand: npm --prefix backend ci --include=dev && npm --prefix backend run build
    startCommand: node backend/dist/backend/server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://travel-r1q3.vercel.app,https://audio.travelstudent.cloud
