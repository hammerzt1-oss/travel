services:
  - type: web
    name: travel-backend-afnq
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm --prefix backend install --include=dev && npm --prefix backend run build
    startCommand: npm --prefix backend run start
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://travel-woad-five.vercel.app
